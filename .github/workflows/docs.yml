name: Deploy documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOCS_PUBLISH_ENABLED: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      publish-enabled: ${{ env.DOCS_PUBLISH_ENABLED }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: latest
          cache: npm
      - run: npm ci
      - name: Format files
        run: npm run format
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Commit formatting changes
        env:
          HUSKY: '0'
          BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          CAN_PUSH: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          if git diff --quiet; then
            exit 0
          fi
          if [ "$CAN_PUSH" != 'true' ]; then
            echo "::error::Formatting changes are required. Run npm run format locally and commit the changes."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "Apply formatting" -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
          git push origin "HEAD:refs/heads/$BRANCH"
      - run: npx nx run @tateru/docs:build
        env:
          NX_DAEMON: 'false'
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request' && env.DOCS_PUBLISH_ENABLED == 'true'
        with:
          path: packages/docs/.vitepress/dist

  deploy:
    if: github.event_name != 'pull_request' && needs.build.outputs.publish-enabled == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/deploy-pages@v5
        id: deployment
